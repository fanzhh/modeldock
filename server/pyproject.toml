[project]
name = "modeldock-server"
version = "0.1.0"
description = "ModelDock server: Colab + Drive model depot and deployment orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "cryptography>=43",
    # Colab 会话通道随包提供：网页「登录 Colab/Open Tunnel」不需要用户预装 CLI
    "google-colab-cli>=0.7",
    # Linux 服务器无 SecretService/keyring backend 时 CLI 存不下 token；
    # 提供 plaintext 文件 backend（配合 PYTHON_KEYRING_BACKEND，见 start.sh）
    "keyrings.alt>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
